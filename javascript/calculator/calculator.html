<html>
    <head>
        <link rel="stylesheet" href="calculator.css">
    </head> 
    <body>
        <h1>Simple calculator</h1>
        <fieldset>
        <input id="num1" type="number" placeholder=""><br><br>
        <input id="num2" type="number" placeholder=""><br><br>
        <button id="add-btn" onclick="add()">Add</button>

        <h2 id="result">Result: 0</h2>
        </fieldset>
        <script src="script.js"></script>
    </body>
</html>
